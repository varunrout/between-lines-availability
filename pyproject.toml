[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "between-lines-availability"
version = "0.1.0"
description = "Between-Lines Availability Model using StatsBomb 360 Data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "statsbombpy>=1.0.3",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "shapely>=2.0.0",
    "scikit-learn>=1.2.0",
    "xgboost>=1.7.0",
    "matplotlib>=3.6.0",
    "mplsoccer>=1.1.12",
    "seaborn>=0.12.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
